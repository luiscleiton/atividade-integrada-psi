<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grão Nobre</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/menu.js" defer></script>
</head>
<body>
    <header class="cabecalho">
    <a class="marca" href="index.html" aria-label="Grão Nobre - início">
        <img
            class="logo"
            src="https://res.cloudinary.com/jbci8qwj/image/upload/v1795135930/logo-grao-nobre.png"
            alt="Grão Nobre"
        >
    </a>

    <nav class="menu" aria-label="Menu principal">
        <button
            class="menu-botao"
            type="button"
            aria-expanded="false"
            aria-controls="menu-principal"
        >
            <span class="menu-botao-texto">Menu</span>
            <span class="menu-icone" aria-hidden="true">☰</span>
        </button>

        <ul class="menu-lista" id="menu-principal">
            <li>
                <a class="menu-link menu-link-ativo" href="index.html" aria-current="page">Nossos cafés</a>
            </li>

            <li>
                <a class="menu-link" href="sobre.html">Sobre nós</a>
            </li>

            <li>
                <a class="menu-link" href="contato.html">Contato</a>
            </li>
        </ul>
    </nav>
    </header>

    <main class="conteudo">
        <section id="catalogo" aria-labelledby="titulo-catalogo">
            <h1 id="titulo-catalogo" class="titulo-catalogo">
                Nossos cafés
            </h1>

            <!-- Estrutura visual: os filtros serão implementados depois. -->
            <nav class="categorias" aria-label="Categorias de produtos">
                <button
                    class="categoria categoria-ativa"
                    type="button"
                    aria-pressed="true"
                >
                    Todos
                </button>

                <button
                    class="categoria"
                    type="button"
                    aria-pressed="false"
                >
                    Em grãos
                </button>

                <button
                    class="categoria"
                    type="button"
                    aria-pressed="false"
                >
                    Moídos
                </button>

                <button
                    class="categoria"
                    type="button"
                    aria-pressed="false"
                >
                    Kits
                </button>
            </nav>

            <div class="lista-produtos" id="lista-produtos">
                <!-- Card provisório para validar o layout antes da API. -->
                <article class="produto">
                    <div class="produto-imagem produto-bourbon-amarelo">
                        <img
                            src="https://res.cloudinary.com/jbci8qwj/image/upload/v1795139340/bourbon-amarelo.svg"
                            alt="Embalagem do café Bourbon Amarelo Grão Nobre"
                        >
                    </div>

                    <div class="produto-informacoes">
                        <h2 class="produto-nome">Bourbon Amarelo</h2>
                        <p class="produto-preco">R$ 34,90</p>
                    </div>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
