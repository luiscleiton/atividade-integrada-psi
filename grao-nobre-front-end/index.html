<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grão Nobre</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/menu.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/vitrine.js" defer></script>
</head>

<body>
    <header class="cabecalho">
        <a class="marca" href="index.html" aria-label="Grão Nobre - início">
            <img class="logo" src="https://res.cloudinary.com/jbci8qwj/image/upload/v1795135930/logo-grao-nobre.png"
                alt="Grão Nobre">
        </a>

        <nav class="menu" aria-label="Menu principal">
            <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu-principal">
                <span class="menu-botao-texto">Menu</span>
                <span class="menu-icone" aria-hidden="true">☰</span>
            </button>

            <ul class="menu-lista" id="menu-principal">
                <li>
                    <a class="menu-link menu-link-ativo" href="index.html" aria-current="page">Nossos cafés</a>
                </li>

                <li>
                    <a class="menu-link" href="sobre.html">Sobre nós</a>
                </li>

                <li>
                    <a class="menu-link" href="contato.html">Contato</a>
                </li>

                <li>
                    <a class="menu-link" href="admin.html">Área administrativa</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="conteudo">
        <section id="catalogo" aria-labelledby="titulo-catalogo">
            <h1 id="titulo-catalogo" class="titulo-catalogo">
                Nossos cafés
            </h1>

            <!-- Busca de produtos. -->
            <div class="busca-produtos">
                <label for="busca-produtos">Buscar café</label>

                <input type="search" id="busca-produtos" placeholder="Digite o nome do café" autocomplete="off"
                    disabled>
            </div>

            <!-- Filtros de produtos. -->
            <nav class="categorias" aria-label="Categorias de produtos">
                <button class="categoria categoria-ativa" type="button" data-categoria="todos" aria-pressed="true"
                    disabled>
                    Todos
                </button>

                <button class="categoria" type="button" data-categoria="1" aria-pressed="false" disabled>
                    Em grãos
                </button>

                <button class="categoria" type="button" data-categoria="2" aria-pressed="false" disabled>
                    Moídos
                </button>

                <button class="categoria" type="button" data-categoria="3" aria-pressed="false" disabled>
                    Kits
                </button>
            </nav>

            <p id="mensagem-produtos" class="mensagem-produtos" role="status">
                Carregando cafés...
            </p>

            <div class="lista-produtos" id="lista-produtos"></div>
        </section>
    </main>
</body>

</html>
