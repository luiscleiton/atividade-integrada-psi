# version: '3.8'

services:
  json-server:
    image: easypi/json-server
    container_name: meu_json_server
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    command:
      - /data/db.json
      - --host
      - "0.0.0.0"
      - --port
      - "3000"
    restart: unless-stopped
    develop:
      watch:
        - action: restart
          path: ./data/db.json
